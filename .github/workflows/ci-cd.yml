name: WebVerse backend CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Syntax and application checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check JavaScript syntax
        run: find src -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Load Express app and routes
        run: node -e "require('./src/app')"
      - name: Check combined assessment rubric
        run: node -e "const {evaluateCombinedPortfolio}=require('./src/services/combinedPortfolioEvaluator'); const result=evaluateCombinedPortfolio('', ''); const max=result.categories.reduce((sum,item)=>sum+item.maxMarks,0); if(max!==100 || result.score!==0 || result.passed) process.exit(1);"

  deploy-preview:
    name: Deploy Vercel preview
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.VERCEL_DEPLOY_ENABLED == 'true' }}
    needs: verify
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global vercel@latest
      - run: vercel pull --yes --environment=preview --token="${{ secrets.VERCEL_TOKEN }}"
      - run: vercel build --token="${{ secrets.VERCEL_TOKEN }}"
      - run: vercel deploy --prebuilt --token="${{ secrets.VERCEL_TOKEN }}"

  deploy-production:
    name: Deploy Vercel production
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.VERCEL_DEPLOY_ENABLED == 'true' }}
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global vercel@latest
      - run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
      - run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
      - run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
